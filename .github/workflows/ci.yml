name: CI and vertical E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: washroom-status-frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-local-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: washroom-status-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  edge:
    name: Edge function checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check E2E edge runtime
        run: deno check washroom-status-frontend/e2e/edge-server.ts
      - name: Run all edge-function tests
        run: deno test --allow-env --allow-net --allow-read supabase-edge-functions/supabase/functions

  registration:
    name: Python registration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: registration-api-python/api/v1
    env:
      POSTGRES_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test
      POSTGRES_FILE_NAME: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install manifest dependencies
        run: |
          python -c "import subprocess,sys,tomllib; subprocess.check_call([sys.executable,'-m','pip','install',*tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']])"
      - run: python -m unittest discover -s tests -p "test_*.py"

  etl:
    name: Python ETL and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: washroom_etl_test
          POSTGRES_USER: etl_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U etl_test -d washroom_etl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: registration-api-python/etl
    env:
      ETL_TEST_DATABASE_URL: postgresql://etl_test:local-ci-only@127.0.0.1:55432/washroom_etl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: registration-api-python/etl/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"

  vertical-e2e:
    name: Vertical E2E (browser to database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, edge, registration, etl]
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: washroom-status-frontend
    env:
      E2E_REDIS_URL: redis://127.0.0.1:56379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: washroom-status-frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser-to-database journeys
        run: npm run test:e2e
      - name: Upload failure screenshots and HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vertical-e2e-report
          path: |
            washroom-status-frontend/playwright-report/
            washroom-status-frontend/test-results/
          retention-days: 7
